<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2196F3">
<title>Suomea</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="phone">
  <header id="topbar" class="topbar"></header>

  <div id="voice-warning" class="voice-warning" role="alert" hidden>
    <span>Финский голос не найден — слова будут звучать с акцентом или без звука. Установите финский голос (лучше Satu) в настройках речи устройства и перезагрузите страницу.</span>
    <button id="voice-warning-close" class="voice-warning-close" aria-label="Закрыть">&times;</button>
  </div>

  <main id="app-body"></main>

  <nav id="bottombar" class="bottombar" hidden></nav>
</div>

<script src="js/speech.js"></script>
<script src="js/words.js"></script>
<script src="js/sentences.js"></script>
<script src="js/app.js"></script>
</body>
</html>
